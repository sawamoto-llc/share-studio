<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>けんさく</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #f5f2ea; color: #333;
    font-family: "BIZ UDPGothic", "Yu Gothic UI", "Meiryo", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 30px; padding: 24px; text-align: center;
  }
  h1 { font-size: 30px; color: #2e7d32; }
  form.search { display: flex; gap: 10px; width: min(640px, 94%); }
  form.search input {
    flex: 1; font-size: 24px; padding: 16px 18px; border-radius: 999px; border: 2px solid #bbb;
  }
  form.search input:focus { outline: none; border-color: #2e7d32; }
  form.search button {
    font-size: 22px; padding: 14px 34px; border: none; border-radius: 999px;
    background: #2e7d32; color: #fff; cursor: pointer; white-space: nowrap;
  }
  form.search button:hover { background: #4caf50; }
  form.search button.alt { background: #5c6bc0; }
  form.search button.alt:hover { background: #7986cb; }
  .urlRow { display: flex; gap: 8px; width: min(560px, 94%); }
  .urlRow input {
    flex: 1; font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 1px solid #bbb;
  }
  .urlRow button {
    font-size: 16px; padding: 10px 20px; border: none; border-radius: 10px;
    background: #5c6bc0; color: #fff; cursor: pointer; white-space: nowrap;
  }
  .miniTitle { font-size: 14px; color: #999; margin-bottom: -22px; }
  .note { font-size: 14px; color: #999; line-height: 1.8; max-width: 600px; }
</style>
</head>
<body>
  <h1>🔍 インターネットで調べる</h1>

  <form class="search" action="https://www.bing.com/search" method="get">
    <input type="text" name="q" placeholder="調べたい言葉を入力" autofocus autocomplete="off">
    <button type="submit">検索</button>
    <button type="button" id="mapBtn" class="alt" title="入力した地名をGoogleマップで表示">🗺 地図で見る</button>
  </form>

  <div class="miniTitle">ホームページのURLが分かっているとき</div>
  <div class="urlRow">
    <input type="text" id="urlInput" placeholder="URLを入力・貼り付け">
    <button id="urlGo">開く</button>
  </div>

  <div class="note">
    ※GoogleやYahoo!は、この窓の中では表示できない決まりになっています(検索は上の窓からどうぞ)。<br>
    ほかにも一部、窓の中に表示できないホームページがあります(白いまま/エラーになります)。
  </div>

  <div class="note" style="border-top: 1px solid #ddd; padding-top: 14px;">
    <b>検索結果が「別のタブ」で開いてしまうとき</b>(そのパソコンで最初の1回だけ直せばOK):<br>
    <a href="https://www.bing.com/account/general" target="_blank" rel="noopener">⚙ Bingの設定を開く(別タブで開きます)</a><br>
    →「検索結果」の「新しいタブまたはウィンドウに…を開きます」の<b>チェックを2つとも外す</b><br>
    → 一番下の「<b>保存</b>」を押す → 設定のタブを閉じて、このスタジオに戻る
  </div>

<script>

  // 動画・地図のページは、公式の「埋め込み用」表示に変換する(そのままでは窓の中に表示できないため)
  function toEmbedUrl(raw) {
    var url;
    try { url = new URL(raw); } catch (e) { return null; }
    var host = url.hostname.replace(/^www\.|^m\./, '');
    // --- 動画ページ ---
    if (host === 'youtu.be' || host === 'youtube.com' || host === 'youtube-nocookie.com') {
      var id = '';
      if (host === 'youtu.be') id = url.pathname.split('/')[1] || '';
      else if (url.pathname === '/watch') id = url.searchParams.get('v') || '';
      else { var m = url.pathname.match(/^\/(shorts|live|embed)\/([^\/?]+)/); if (m) id = m[2]; }
      if (!id) return null;
      var e = 'https://www.youtube-nocookie.com/embed/' + id + '?autoplay=1&rel=0';
      var list = url.searchParams.get('list');
      if (list) e += '&list=' + encodeURIComponent(list);
      return e;
    }
    // --- Googleマップ ---
    if (/(^|\.)google\.[a-z.]+$/.test(host) && url.pathname.indexOf('/maps') === 0) {
      var q = url.searchParams.get('q') || url.searchParams.get('query') || '';
      var pm = url.pathname.match(/\/maps\/(?:place|search)\/([^\/]+)/);
      if (!q && pm) q = decodeURIComponent(pm[1].replace(/\+/g, ' '));
      var dm = url.pathname.match(/\/maps\/dir\/[^\/]*\/([^\/]+)/);
      if (!q && dm) q = decodeURIComponent(dm[1].replace(/\+/g, ' '));
      var at = url.pathname.match(/@(-?[\d.]+),(-?[\d.]+)(?:,([\d.]+)z)?/);
      if (!q && at) q = at[1] + ',' + at[2];
      if (!q) return null;
      var me = 'https://maps.google.com/maps?q=' + encodeURIComponent(q) + '&hl=ja&output=embed';
      if (at && at[3]) me += '&z=' + Math.round(parseFloat(at[3]));
      return me;
    }
    if (host === 'maps.app.goo.gl' || host === 'goo.gl') {
      alert('地図の短縮リンク(maps.app.goo.gl)は窓の中で開けません。\n上の欄に地名を入れて「🗺 地図で見る」を押してください。');
      return 'about:blank';
    }
    return null;
  }
  function mapEmbedUrl(place) {
    return 'https://maps.google.com/maps?q=' + encodeURIComponent(place) + '&hl=ja&output=embed';
  }

  function openUrl() {
    var v = document.getElementById('urlInput').value.trim();
    if (!v) return;
    if (!/^https?:\/\//i.test(v)) v = 'https://' + v;
    var embed = toEmbedUrl(v);
    if (embed === 'about:blank') return;
    location.href = embed || v;
  }
  document.getElementById('mapBtn').addEventListener('click', function () {
    var place = document.querySelector('input[name=q]').value.trim();
    if (!place) { alert('上の欄に地名(例: 本山町、高知城)を入れてから押してください。'); return; }
    location.href = mapEmbedUrl(place);
  });
  document.getElementById('urlGo').addEventListener('click', openUrl);
  document.getElementById('urlInput').addEventListener('keydown', function (e) {
    if (e.key === 'Enter') openUrl();
  });
</script>
</body>
</html>
